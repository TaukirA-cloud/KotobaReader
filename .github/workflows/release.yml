name: Windows release
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Check source and test reader
        shell: pwsh
        run: |
          python scripts/check-public-source.py
          if ($LASTEXITCODE -ne 0) { throw 'Public-source checks failed.' }
          ./scripts/test.ps1 -Ui
      - name: Build portable executable
        shell: pwsh
        run: ./scripts/publish.ps1
      - name: Publish preview release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create $env:RELEASE_TAG artifacts/KotobaReader-win-x64.zip artifacts/KotobaReader-win-x64.zip.sha256 --verify-tag --prerelease --title "KotobaReader $env:RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed.' }
