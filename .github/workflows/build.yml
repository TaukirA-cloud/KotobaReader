name: Windows build and regression checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Check public source
        run: python scripts/check-public-source.py
      - name: Build and run core, worker, and Windows UI checks
        shell: pwsh
        run: ./scripts/test.ps1 -Ui
      - name: Package Windows x64 reader
        shell: pwsh
        run: ./scripts/publish.ps1
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: windows-ui-smoke
          path: artifacts/smoke/*.png
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: KotobaReader-win-x64
          path: |
            artifacts/KotobaReader-win-x64.zip
            artifacts/KotobaReader-win-x64.zip.sha256
          if-no-files-found: error
